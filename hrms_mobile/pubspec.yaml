name: hrms_mobile
description: "Jaikalki HRMS — multi-platform mobile/web client (Flutter)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.0

  # HTTP & networking
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI / fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0

  # System
  permission_handler: ^11.3.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/icons/
