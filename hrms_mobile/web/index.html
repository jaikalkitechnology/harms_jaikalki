<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jaikalki HRMS — Human Resource Management for Jaikalki Technology Pvt Ltd.">
  <meta name="theme-color" content="#1A0F08">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jaikalki HRMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jaikalki HRMS</title>
  <link rel="manifest" href="manifest.json">

  <!-- Open connections early: fonts (google_fonts) and the CanvasKit
       renderer are fetched from these hosts during start-up. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #1A0F08; }
    /* Shown while the app downloads; removed on Flutter's first frame. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 22px;
      background: #1A0F08; transition: opacity .25s ease;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #splash img { width: 88px; height: 88px; border-radius: 20px; }
    #splash .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(244, 183, 31, .25); border-top-color: #F4B71F;
      animation: spin .8s linear infinite;
    }
    #splash p { margin: 0; color: #D4C3AC; font-size: 13px; letter-spacing: .02em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="spinner"></div>
    <p>Loading Jaikalki HRMS…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
