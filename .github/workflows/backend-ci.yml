name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "hrms_backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "hrms_backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hrms_backend
    env:
      # SQLite-in-memory keeps the test suite hermetic — see tests/conftest.py.
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DATABASE_URL_SYNC: "sqlite+pysqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/0"
      JWT_SECRET_KEY: "ci-test-secret"
      STORAGE_BACKEND: "local"
      LOCAL_STORAGE_PATH: "/tmp/hrms-ci-uploads"
      PUBLIC_BASE_URL: "http://localhost:8000"
      ENVIRONMENT: "ci"

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: hrms_backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  smoke-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: hrms_backend
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DATABASE_URL_SYNC: "sqlite+pysqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/0"
      JWT_SECRET_KEY: "ci-test-secret"
      STORAGE_BACKEND: "local"
      LOCAL_STORAGE_PATH: "/tmp/hrms-ci-uploads"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: hrms_backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify FastAPI app boots
        run: |
          python -c "
          from app.main import app
          assert any(r.path == '/api/v1/health' for r in app.routes)
          print('routes:', len(app.routes))
          "
