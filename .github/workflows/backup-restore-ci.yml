name: Backup / Restore Verify

# Runs nightly + on demand. Spins up a MySQL 8 service, seeds it with the
# Alembic migrations + a few rows, runs scripts/ops/backup_mysql.sh, then
# scripts/ops/restore_mysql.sh into a fresh database and asserts the
# rows came back. Catches "the backup script silently broke" before
# you find out at 3am during a real incident.

on:
  schedule:
    - cron: "0 22 * * *"   # 03:30 IST nightly
  workflow_dispatch:
  pull_request:
    paths:
      - "hrms_backend/scripts/ops/**"
      - ".github/workflows/backup-restore-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test
          MYSQL_DATABASE: hrms_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pci-test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-test
      MYSQL_DATABASE: hrms_ci
      DATABASE_URL: "mysql+aiomysql://root:ci-test@127.0.0.1:3306/hrms_ci?charset=utf8mb4"
      DATABASE_URL_SYNC: "mysql+pymysql://root:ci-test@127.0.0.1:3306/hrms_ci?charset=utf8mb4"
      JWT_SECRET_KEY: "ci-test-secret"
      STORAGE_BACKEND: "local"
      LOCAL_STORAGE_PATH: "/tmp/hrms-ci-uploads"
      BACKUP_DIR: "/tmp/hrms-ci-backups"
      RETAIN_DAYS: "7"

    defaults:
      run:
        working-directory: hrms_backend

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client
        run: sudo apt-get update -y && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_PASSWORD}" --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become healthy"; exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: hrms_backend/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations + seed a sentinel row
        run: |
          alembic upgrade head
          mysql -h 127.0.0.1 -uroot -p"${MYSQL_PASSWORD}" hrms_ci <<'SQL'
            INSERT INTO users (email, password_hash, full_name, is_active,
                               is_admin_portal, mfa_enabled, created_at, updated_at)
              VALUES ('backup-canary@jaikalki.com', 'x', 'Backup Canary',
                      1, 1, 0, NOW(), NOW());
          SQL

      - name: Take a backup
        run: bash scripts/ops/backup_mysql.sh

      - name: Inspect backup file
        run: |
          ls -lh "${BACKUP_DIR}"
          test -f "${BACKUP_DIR}/${MYSQL_DATABASE}_"*.sql.gz
          gunzip -t "${BACKUP_DIR}/${MYSQL_DATABASE}_"*.sql.gz

      - name: Restore into a fresh database
        run: |
          export MYSQL_DATABASE=hrms_ci_restored
          mysql -h 127.0.0.1 -uroot -p"${MYSQL_PASSWORD}" -e \
            "CREATE DATABASE ${MYSQL_DATABASE} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          # Auto-confirm restore prompt
          BACKUP_FILE=$(ls -t "${BACKUP_DIR}"/hrms_ci_*.sql.gz | head -1)
          yes y | bash scripts/ops/restore_mysql.sh "$BACKUP_FILE"

      - name: Verify the canary row survived
        run: |
          export MYSQL_DATABASE=hrms_ci_restored
          ROWS=$(mysql -h 127.0.0.1 -uroot -p"${MYSQL_PASSWORD}" -N -e \
            "SELECT COUNT(*) FROM ${MYSQL_DATABASE}.users WHERE email='backup-canary@jaikalki.com';")
          echo "rows: $ROWS"
          test "$ROWS" = "1"
